<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Expense Tracker</h1>

      <section class="balance-section">
        <p class="label">Your balance</p>
        <h2 id="balance">$0.00</h2>
      </section>

      <section class="summary-card">
        <div class="summary-item">
          <p class="label">Income</p>
          <p id="income" class="amount income-text">0.00</p>
        </div>
        <div class="divider"></div>
        <div class="summary-item">
          <p class="label">Expense</p>
          <p id="expense" class="amount expense-text">0.00</p>
        </div>
      </section>

      <section class="history-section">
        <h3>History</h3>
        <ul id="transaction-list" class="transaction-list">
          <!-- JS will insert <li> transaction items here -->
        </ul>
      </section>

      <section class="form-section">
        <h3>Add new transaction</h3>

        <form id="transaction-form">
          <label for="text">Text</label>
          <input
            type="text"
            id="text"
            placeholder="Enter text..."
            autocomplete="off"
          />

          <label for="amount">Amount</label>
          <p class="hint">(negative - expense, positive - income)</p>
          <input type="number" id="amount" placeholder="0" />

          <button type="submit" id="add-btn">Add transaction</button>
        </form>
      </section>

      <section class="slip-section">
        <h3>Statement</h3>
        <p class="hint">Download a PDF slip of all your transactions</p>
        <button id="generate-slip-btn" class="slip-btn">
          Download Slip (PDF)
        </button>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Developed with <span class="heart">♥</span> by
        <a
          href="https://www.linkedin.com/in/ghulam-anwar-salar-b24509247/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ghulam Anwar
        </a>
      </p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
